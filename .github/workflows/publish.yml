# Publishes the package to npm with a provenance attestation when a version
# tag (e.g. 1.0.0) is pushed. n8n requires community nodes to be published
# from GitHub Actions with provenance since May 1 2026.
#
# These steps mirror what `n8n-node release` does in CI (lint, build,
# `npm publish` with RELEASE_MODE and provenance), plus the test suite. They
# are spelled out because the local `release` script runs release-it, which
# would try to bump the version again here.
#
# Authentication is npm Trusted Publishing only (OIDC, no secrets): on
# npmjs.com, package settings > Trusted Publisher > GitHub Actions, with owner
# `Womabre`, repository `n8n-nodes-zipline-api`, workflow `publish.yml`. No
# npm token is passed, so a broken trust config fails the publish instead of
# silently falling back to a token.
#
# Release: move the CHANGELOG [Unreleased] entries under a new version, then
# run `npm run release` locally; it commits, tags and pushes.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token used for Trusted Publishing and provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Node 24 ships npm 11, which Trusted Publishing needs (npm >= 11.5.1,
      # Node >= 22.14).
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a publish job: a poisoned cache would ship.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          npm install -g npm@^11.5.1
          npm publish --provenance --access public
        env:
          # Lets the package's prepublishOnly guard (`n8n-node prerelease`) pass.
          RELEASE_MODE: 'true'
